  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .frame { max-width: 1600px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1600px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

"box" x="376" y="200" width="656" height="240" rx="6" fill="#fcf0e9" stroke="#eb6c36" stroke-width="2"/><text x="400" y="236" class="name">018 · 보정 + short-B + 잔차를 모두 포함</text><text x="400" y="268" class="tech">raw = .3 KRR26 + .3 CNN(mean3) + .2 S(mean3) + .2 B(mean3)</text><text x="400" y="292" class="tech">cal(raw) = 194.1655162532 + 1.1103548755 × (raw − 194.0592588401)</text><text x="400" y="316" class="tech">018 = .9 cal(raw) + .1 shortB + mean3(weighted residual)</text><text x="400" y="340" class="body">잔차: physics57 + DINO-B spatial528 → 585차원</text><text x="400" y="364" class="body">정확한 내부 순서와 각 층은 018 상세 그림 참조</text></g><g class="node" data-node="prepL"><rect class="box" x="376" y="552" width="288" height="224" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="400" y="588" class="name">L 경로 전처리</text><text x="400" y="620" class="tech">BICUBIC resize → 504 × 504</text><text x="400" y="644" class="tech">1 channel → replicated RGB</text><text x="400" y="668" class="tech">/255 → ImageNet normalization</text><text x="400" y="692" class="tech">μ=[.485,.456,.406]</text><text x="400" y="716" class="tech">σ=[.229,.224,.225]</text></g><g class="node" data-node="dinoL"><rect class="box" x="720" y="552" width="312" height="224" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="744" y="588" class="name">동결 DINOv2-L / ViT-L/14</text><text x="744" y="620" class="tech">24 blocks · width 1024</text><text x="744" y="644" class="tech">1296 patches · 36 × 36</text><text x="744" y="668" class="tech">layers = [11,17,23] (0-based)</text><text x="744" y="692" class="body">각 층: normalized CLS + mean + std</text><text x="744" y="716" class="tech">3 layers × 3 pools × 1024 = 9216</text></g><g class="node" data-node="headL"><rect class="box" x="1088" y="552" width="456" height="224" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/><text x="1112" y="588" class="name">L 헤드 3개 → 예측 평균</text><text x="1112" y="620" class="tech">9216 → StandardScaler → 64 → 1
